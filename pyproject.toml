[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "so101-vla"
version = "0.1.0.dev0"
description = "Educational reproductions of classic VLA algorithms and continual-learning VLA research on a self-built SO-101 arm (LeRobot + MuJoCo, <=48GB train / <=8GB deploy)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Wengang Niu" }]
keywords = ["vla", "robot-learning", "lerobot", "so-101", "imitation-learning", "continual-learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # Pinned: the whole repo is written against the LeRobot 0.6.x policy API
  # (PreTrainedConfig / PreTrainedPolicy / processors). Bump deliberately.
  "lerobot==0.6.2",
  "torch>=2.2",
  "numpy",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "pre-commit>=4.0",
]
deploy = [
  "onnx>=1.16",
  "onnxruntime>=1.18",
]

[project.urls]
Homepage = "https://github.com/wengang-niu/so101_vla"
Repository = "https://github.com/wengang-niu/so101_vla"
Issues = "https://github.com/wengang-niu/so101_vla/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/so101_vla"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests may use asserts freely and long literals
"tests/**" = ["E731"]
