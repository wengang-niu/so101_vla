<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#777"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="600" fill="#FFFFFF"/>
  <g font-family="LXGW WenKai, FandolHei, sans-serif" fill="#222">

    <text x="24" y="42" font-size="21" font-weight="700">持续学习框架：学新任务，不忘旧技能</text>

    <!-- task stream -->
    <rect x="24" y="110" width="190" height="180" rx="10" fill="#E8F2DC" stroke="#B6D7A8"/>
    <text x="44" y="142" font-size="15.5" font-weight="700">任务流</text>
    <text x="44" y="176" font-size="13">任务 1 →</text>
    <text x="44" y="204" font-size="13">任务 2 →</text>
    <text x="44" y="232" font-size="13">任务 3 →</text>
    <text x="44" y="264" font-size="11.5">新任务不断到来</text>

    <!-- frozen base -->
    <rect x="340" y="76" width="320" height="84" rx="10" fill="#E0E0E0" stroke="#B0B0B0"/>
    <text x="360" y="108" font-size="15.5" font-weight="700">冻结基座 miniVLA</text>
    <text x="360" y="134" font-size="12.5">永远不动，所有任务共享</text>

    <!-- experts -->
    <rect x="340" y="210" width="320" height="64" rx="10" fill="#CFE2F3" stroke="#6FA8DC"/>
    <text x="360" y="238" font-size="13.5" font-weight="700">LoRA 专家 1（任务 1）</text>
    <text x="360" y="260" font-size="11.5">已完成，原封不动</text>

    <rect x="340" y="292" width="320" height="64" rx="10" fill="#D9EAD3" stroke="#93C47D"/>
    <text x="360" y="320" font-size="13.5" font-weight="700">LoRA 专家 2（任务 2）</text>
    <text x="360" y="342" font-size="11.5">已完成，原封不动</text>

    <rect x="340" y="374" width="320" height="64" rx="10" fill="#FCE5CD" stroke="#F4B183"/>
    <text x="360" y="402" font-size="13.5" font-weight="700">LoRA 专家 3（任务 3，训练中）</text>
    <text x="360" y="424" font-size="11.5">每次只训这一个</text>

    <!-- gate -->
    <polygon points="860,182 962,250 860,318 758,250" fill="#FFF2CC" stroke="#FFD966"/>
    <text x="860" y="244" font-size="13" font-weight="700" text-anchor="middle">值得记吗？</text>
    <text x="860" y="268" font-size="11.5" text-anchor="middle">够新颖 / 有冲突</text>

    <!-- skip -->
    <rect x="780" y="352" width="180" height="48" rx="10" fill="#F4F4F4" stroke="#CCC"/>
    <text x="800" y="381" font-size="11.5">否：丢弃，不污染记忆</text>

    <!-- memory -->
    <rect x="1040" y="180" width="216" height="140" rx="14" fill="#DDD3EC" stroke="#B4A7D6"/>
    <text x="1062" y="216" font-size="15" font-weight="700">锚点记忆库</text>
    <text x="1062" y="246" font-size="12">只存少量关键 episode</text>
    <text x="1062" y="270" font-size="12">（新颖 / 冲突才写入）</text>

    <!-- router / output -->
    <rect x="340" y="492" width="320" height="62" rx="10" fill="#DDD3EC" stroke="#B4A7D6"/>
    <text x="358" y="522" font-size="13" font-weight="700">任务路由</text>
    <text x="358" y="544" font-size="11.5">按当前任务选用 / 组合专家</text>

    <rect x="780" y="492" width="220" height="62" rx="10" fill="#E2EFDA" stroke="#93C47D"/>
    <text x="800" y="522" font-size="14.5" font-weight="700">输出动作</text>
    <text x="800" y="544" font-size="11">旧任务稳定执行</text>

    <!-- arrows -->
    <path d="M214 262 C 260 300 280 360 336 402" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="226" y="330" font-size="11.5" fill="#555">新任务：只训新专家</text>

    <line x1="500" y1="160" x2="500" y2="206" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="508" y="188" font-size="11" fill="#555">共享</text>

    <path d="M660 406 C 700 406 720 330 770 282" fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="688" y="368" font-size="11.5" fill="#555">新 episode</text>

    <line x1="962" y1="250" x2="1036" y2="250" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="962" y="238" font-size="11" fill="#555">是，写入</text>

    <line x1="860" y1="318" x2="860" y2="348" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>

    <path d="M1148 320 C 1150 430 900 470 668 418" fill="none" stroke="#777" stroke-width="1.8"
          stroke-dasharray="7 5" marker-end="url(#arrd)"/>
    <text x="876" y="474" font-size="11.5" fill="#777">回放抗遗忘</text>

    <line x1="500" y1="438" x2="500" y2="488" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="508" y="470" font-size="11" fill="#555">选用 / 组合</text>

    <line x1="660" y1="523" x2="776" y2="523" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>

    <!-- caption -->
    <text x="640" y="585" font-size="13.5" fill="#666" text-anchor="middle">基座不动 · 专家隔离 · 只记关键经验 · 回放抗遗忘</text>

  </g>
</svg>
