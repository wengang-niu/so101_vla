# Pre-commit hygiene: lint + secret scan.
# Secrets in this repo are a hard failure (gitleaks + tests/test_no_secrets.py).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
